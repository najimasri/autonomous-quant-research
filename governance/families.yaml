families:
  F14A_funding_extreme_mean_reversion_carry:
    description: >-
      Funding-extreme mean reversion and carry using prior funding-rate level,
      z-score, and streak state.
    instruments: [BTC]
    decision_timeframes: [1h, 4h]
    param_budget_max_combos: 48
  F14B_liquidation_cascade:
    description: >-
      Liquidation-cascade continuation and exhaustion fade using prior
      liquidation-volume bursts.
    instruments: [BTC]
    decision_timeframes: [1h, 4h]
    param_budget_max_combos: 48
  F14C_oi_confirmed_breakout:
