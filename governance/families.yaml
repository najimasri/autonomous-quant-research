      Price breakout confirmed by open-interest expansion and filtered by the
      prior long/short ratio.
    instruments: [BTC]
    decision_timeframes: [1h, 4h]
    param_budget_max_combos: 48
  F14D_derivatives_causal_ml:
    description: >-
      Causal ML on the frozen derivatives feature set under the existing v1.3
      A28I-grade protocol.
    instruments: [BTC]
    decision_timeframes: [1h, 4h]
    param_budget_max_combos: 48
    protocol: >-
      Frozen and hashed prior-only feature order; expanding-window outer
      predictions; economics, controls, and gates computed on outer actions
      only; hyperparameter selection nested within development folds.
hard_rules_addendum:
  - cost-to-stop ratio must be <= 0.15
  - controls use real 200-member re-simulated ensembles
  - every input is prior-only and shift-audited
  - grids and feature order are frozen and hashed before evaluation
  - overnight or weekend-dependent candidates carry SWING_REQUIRED flags
  - total mission trial cap remains 2000 configurations
  - no validation gate may be weakened to manufacture survivors
