  F14A funding-extreme mean reversion/carry (funding-rate level, z-score, streaks); F14B liquidation-cascade continuation and exhaustion-fade (liquidation volume bursts); F14C OI-confirmed breakout (price break + open-interest expansion + long/short-ratio filter); F14D causal-ML on the derivatives feature set under the existing v1.3 A28I-grade protocol (frozen hashed features, outer actions only, nested selection). All round-3 hard rules remain (cost-to-stop ≤0.15, real 200-member re-simulated controls, prior-only inputs, frozen hashed grids before evaluation, SWING_REQUIRED flags, trial cap).
