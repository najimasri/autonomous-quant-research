families:
  F13_causal_ml:
    description: >
      Machine-learned GO/NO-GO scoring over a frozen prior-only feature
      set, evaluated strictly on walk-forward outer predictions.
    instruments: [BTC, XAU]
    decision_timeframes: [1h, 4h]
    candidate_generator: >
      mechanical, registered before evaluation: every decision bar
      passing (a) minimum volatility floor and (b) the cost-to-stop
      ratio gate for an ATR-multiple stop; both directions scored.
    feature_classes: >
      multi-horizon returns and momentum; ATR/vol ratios and compression
      metrics; position within session/day/week ranges; stretch z-scores;
      session and day-of-week encodings from the frozen session map;
      volume-regime features BTC-only. All prior-only, shift-audited,
      frozen and hashed before any training.
    model_grid: >
      RandomForestRegressor and GradientBoosting; small registered grid
      (depth 3-4, min_samples_leaf 50-100, 300 trees, fixed seeds);
      targets 2.5R and 3.0R; GO threshold values registered in the grid.
    param_budget_max_combos: 48
    protocol: >
      expanding-window walk-forward by year: train on all years <= t,
      predict year t+1 only; outer actions accumulate across folds;
      economics, controls, and every gate computed on outer actions only;
      hyperparameter selection nested within development folds; DSR
      multiplicity includes the full historical ledger.
hard_rules_addendum:
  - all round-3 hard rules remain in force (cost-to-stop <= 0.15, real
    re-simulated controls, frozen grids before evaluation, prior-only
    inputs, SWING_REQUIRED flagging, trial cap 2000)
  - model binaries hashed per fold; feature-order hash recorded; any
    feature added after results are seen voids the round
