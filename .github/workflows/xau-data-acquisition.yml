name: XAU data acquisition

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First UTC date to acquire (inclusive)
        required: true
        default: "2010-01-01"
        type: string
      through_date:
        description: Last UTC date to acquire (inclusive)
        required: true
        default: "2026-07-31"
        type: string

permissions:
  contents: write

jobs:
  acquire-xau:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned requirements
        run: python -m pip install --requirement requirements.txt

      - name: Download and build missing yearly shards
        env:
          START_DATE: ${{ inputs.start_date }}
          THROUGH_DATE: ${{ inputs.through_date }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from datetime import date
          from pathlib import Path

          root = Path.cwd()
          start = date.fromisoformat(os.environ["START_DATE"])
          through = date.fromisoformat(os.environ["THROUGH_DATE"])
          if start < date(2010, 1, 1) or through < start:
              raise SystemExit("range must start on/after 2010-01-01 and end on/after its start")

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(8 * 1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          data_manifest_path = root / "manifests/DATA_SHA256.json"
          data_hashes = json.loads(data_manifest_path.read_text())
          missing = []
          for year in range(start.year, through.year + 1):
              relative = f"data/canonical/xau_1m_{year}.parquet"
              shard = root / relative
              expected = data_hashes.get(relative)
              if shard.is_file() and expected and sha256(shard) == expected:
                  print(f"Skipping verified shard {relative}")
              else:
                  missing.append(year)

          # Each subprocess receives a contiguous range of at most four calendar
          # years, preserving the downloader's built-in pacing and range guard.
          chunks = []
          for year in missing:
              if not chunks or year != chunks[-1][-1] + 1 or len(chunks[-1]) == 4:
                  chunks.append([year])
              else:
                  chunks[-1].append(year)

          combined_path = root / "manifests/xau_batch_manifest.json"
          if combined_path.exists():
              combined = json.loads(combined_path.read_text())
          else:
              combined = {
                  "instrument": "XAUUSD Dukascopy",
                  "source_files": ["BID_candles_min_1.bi5", "ASK_candles_min_1.bi5"],
                  "price_side": "BID",
                  "spread_proxy": "ask close minus bid close",
                  "spread_label": "CANDLE_DERIVED_APPROXIMATION",
                  "timeframe": "1m",
                  "timezone": "UTC",
                  "known_limits": ["single liquidity provider feed", "bid-side prices",
                                   "tick volume only", "occasional gaps"],
                  "shards": {},
              }

          for index, years in enumerate(chunks):
              first, last = years[0], years[-1]
              chunk_start = max(start, date(first, 1, 1))
              chunk_through = min(through, date(last, 12, 31))
              subprocess.run([
                  sys.executable, "src/ingest/download_xau.py",
                  "--start", chunk_start.isoformat(),
                  "--through", chunk_through.isoformat(),
              ], check=True)
              batch_manifest = root / f"manifests/.xau_batch_{index}.json"
              subprocess.run([
                  sys.executable, "src/tape/build_xau_tape.py",
                  "--start-year", str(first), "--through-year", str(last),
                  "--manifest", str(batch_manifest),
              ], check=True)
              batch = json.loads(batch_manifest.read_text())
              for relative, metadata in batch["shards"].items():
                  actual = sha256(root / relative)
                  if actual != metadata["sha256"]:
                      raise SystemExit(f"new shard hash mismatch: {relative}")
                  combined["shards"][relative] = metadata
              batch_manifest.unlink()

          # Verify every requested shard, including shards skipped on a resumed run.
          for year in range(start.year, through.year + 1):
              relative = f"data/canonical/xau_1m_{year}.parquet"
              shard = root / relative
              metadata = combined["shards"].get(relative)
              if not shard.is_file() or not metadata or sha256(shard) != metadata["sha256"]:
                  raise SystemExit(f"final shard verification failed: {relative}")

          combined_path.write_text(json.dumps(combined, indent=2, sort_keys=True) + "\n")
          # Preserve hashes for policy-optional files not present in this checkout,
          # while replacing the XAU canonical entries with the verified inventory.
          data_hashes.update({
              relative: metadata["sha256"]
              for relative, metadata in combined["shards"].items()
          })
          data_manifest_path.write_text(json.dumps(data_hashes, indent=2, sort_keys=True) + "\n")
          PY

      - name: Regenerate manifests and clean acquisition inputs
        run: |
          # Drop ignored downloads, then restore the tracked source-checkout
          # metadata before inventorying the repository.
          find data/raw/xau -type f \( -name '*.bi5' -o -name '*.part' \) -delete
          git checkout -- data/raw/xau
          python src/audit/build_manifest.py

      - name: Audit source checkout before publishing
        run: |
          python src/audit/audit_ci.py
          python src/audit/audit_phase0_data.py --source-checkout

      - name: Commit, rebase, re-audit, and push to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/canonical/xau_1m_*.parquet
          git add manifests/DATA_SHA256.json manifests/MANIFEST_SHA256.json \
            manifests/xau_batch_manifest.json
          if git diff --cached --quiet; then
            echo "All requested shards and manifests are already current."
            exit 0
          fi
          git commit -m "data: acquire XAU yearly canonical shards"
          git pull --rebase origin main
          # A concurrent main update changes the source inventory. Regenerate and
          # amend so the rebased commit is exactly what the final audits inspect.
          python src/audit/build_manifest.py
          git add manifests/MANIFEST_SHA256.json
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          python src/audit/audit_ci.py
          python src/audit/audit_phase0_data.py --source-checkout
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
