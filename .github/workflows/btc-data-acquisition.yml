name: BTC data acquisition

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: First UTC calendar year to acquire
        required: true
        default: "2017"
        type: string

permissions:
  contents: write

jobs:
  acquire-btc:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned requirements
        run: python -m pip install --requirement requirements.txt

      - name: Download, verify, and build stale or missing yearly shards
        env:
          START_YEAR: ${{ inputs.start_year }}
        run: |
          python - <<'PY'
          import calendar
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path

          import requests

          root = Path.cwd()
          start_year = int(os.environ["START_YEAR"])
          if start_year < 2017 or start_year > date.today().year:
              raise SystemExit(f"start_year must be in 2017..{date.today().year}")

          # Publication can lag the calendar. Probe checksums rather than assuming
          # that the previous month (or only the previous year) is available.
          candidate = date.today().replace(day=1) - timedelta(days=1)
          for _ in range(24):
              published_month = candidate.strftime("%Y-%m")
              checksum_url = (
                  "https://data.binance.vision/data/spot/monthly/klines/"
                  f"BTCUSDT/1m/BTCUSDT-1m-{published_month}.zip.CHECKSUM"
              )
              response = requests.get(checksum_url, timeout=30)
              if response.status_code == 200:
                  break
              if response.status_code != 404:
                  response.raise_for_status()
              candidate = candidate.replace(day=1) - timedelta(days=1)
          else:
              raise SystemExit("could not find a published BTC monthly archive")

          through_year = candidate.year
          if through_year < start_year:
              raise SystemExit(f"no published archive at or after start_year {start_year}")
          print(f"Latest published BTC monthly archive: {published_month}")

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(8 * 1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          def expected_bounds(year):
              first = datetime(year, 1, 1, tzinfo=timezone.utc)
              if year == 2017:
                  first = datetime(2017, 8, 17, 4, tzinfo=timezone.utc)
              last_month = candidate.month if year == through_year else 12
              last = datetime(
                  year, last_month, calendar.monthrange(year, last_month)[1],
                  23, 59, tzinfo=timezone.utc,
              )
              return first.isoformat(), last.isoformat()

          def shard_is_current(year, data_hashes, batch):
              relative = f"data/canonical/btc_1m_{year}.parquet"
              shard = root / relative
              expected = data_hashes.get(relative)
              metadata = batch["shards"].get(relative)
              first_utc, last_utc = expected_bounds(year)
              return bool(
                  shard.is_file() and expected and metadata
                  and sha256(shard) == expected == metadata.get("sha256")
                  and metadata.get("rows", 0) > 0
                  and metadata.get("first_utc") == first_utc
                  and metadata.get("last_utc") == last_utc
              )

          data_path = root / "manifests/DATA_SHA256.json"
          data_hashes = json.loads(data_path.read_text())
          batch_path = root / "manifests/btc_batch_manifest.json"
          if batch_path.exists():
              batch = json.loads(batch_path.read_text())
          else:
              batch = {
                  "instrument": "BTCUSDT spot",
                  "source": "Binance Vision monthly klines",
                  "timeframe": "1m",
                  "timezone": "UTC",
                  "shards": {},
              }

          missing = []
          for year in range(start_year, through_year + 1):
              relative = f"data/canonical/btc_1m_{year}.parquet"
              # The newest shard is deliberately rebuilt: another monthly archive
              # may have appeared since the preceding run.
              if year != through_year and shard_is_current(year, data_hashes, batch):
                  print(f"Skipping verified shard {relative}")
              else:
                  missing.append(year)

          raw = root / "data/raw/btc"
          for year in missing:
              for archive in raw.glob("*.zip"):
                  archive.unlink()
              for partial in raw.glob("*.part"):
                  partial.unlink()
              last_month = candidate.month if year == through_year else 12
              month_after = date(year + (last_month == 12), last_month % 12 + 1, 1)
              subprocess.run([
                  sys.executable, "src/ingest/download_btc.py",
                  "--start", "2017-08-01" if year == 2017 else f"{year}-01-01",
                  # download_btc treats --through as an exclusive month boundary.
                  "--through", month_after.isoformat(),
              ], check=True)
              relative = f"data/canonical/btc_1m_{year}.parquet"
              metadata_path = root / f"manifests/.btc_{year}.json"
              subprocess.run([
                  sys.executable, "src/tape/build_btc_tape.py",
                  "--output", relative, "--metadata", str(metadata_path),
              ], check=True)
              metadata = json.loads(metadata_path.read_text())
              digest = sha256(root / relative)
              if digest != metadata["canonical_sha256"] or metadata["rows"] <= 0:
                  raise SystemExit(f"new shard verification failed: {relative}")
              batch["shards"][relative] = {
                  "first_utc": metadata["first_utc"],
                  "last_utc": metadata["last_utc"],
                  "rows": metadata["rows"],
                  "sha256": digest,
              }
              data_hashes[relative] = digest
              metadata_path.unlink()

          for year in range(start_year, through_year + 1):
              relative = f"data/canonical/btc_1m_{year}.parquet"
              if not shard_is_current(year, data_hashes, batch):
                  raise SystemExit(f"final shard verification failed: {relative}")

          batch_path.write_text(json.dumps(batch, indent=2, sort_keys=True) + "\n")
          data_path.write_text(json.dumps(data_hashes, indent=2, sort_keys=True) + "\n")
          for archive in raw.glob("*.zip"):
              archive.unlink()
          for partial in raw.glob("*.part"):
              partial.unlink()
          subprocess.run(["git", "checkout", "--", "data/raw/btc"], check=True)
          PY

      - name: Regenerate artifact manifest
        run: python src/audit/build_manifest.py

      - name: Audit source checkout before publishing
        run: |
          python src/audit/audit_ci.py
          python src/audit/audit_phase0_data.py --source-checkout

      - name: Commit, rebase, re-audit, and push to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/canonical/btc_1m_*.parquet
          git add manifests/DATA_SHA256.json manifests/MANIFEST_SHA256.json \
            manifests/btc_batch_manifest.json
          if git diff --cached --quiet; then
            echo "All requested shards and manifests are already current."
            exit 0
          fi
          git commit -m "data: acquire BTC yearly canonical shards"
          git pull --rebase origin main
          python src/audit/build_manifest.py
          git add manifests/MANIFEST_SHA256.json
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          python src/audit/audit_ci.py
          python src/audit/audit_phase0_data.py --source-checkout
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
