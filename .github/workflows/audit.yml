name: governance-audit
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python src/audit/audit_holdout_seal.py
      - run: python src/audit/audit_governance.py
      - run: python src/audit/verify_trials.py
      - run: python src/audit/build_manifest.py --check
