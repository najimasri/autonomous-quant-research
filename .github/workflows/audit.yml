name: governance-audit
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Deliberately source-only.  The Phase 0 data audit is a phase-verdict gate.
      - run: python src/audit/audit_ci.py
