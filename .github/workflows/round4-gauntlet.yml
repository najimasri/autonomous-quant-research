name: Round 4 resumable gauntlet

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: round4-gauntlet-main
  cancel-in-progress: false

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Stop after the final verdict
        id: state
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          checkpoint = json.loads(Path("reports/phase3_round4_checkpoint.json").read_text())
          done = checkpoint.get("status") == "complete" and checkpoint.get("verdict_written") is True
          instrument = checkpoint.get("instrument", "BTC")
          if instrument not in {"BTC", "XAU"}:
              raise SystemExit(f"invalid checkpoint instrument: {instrument!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"done={'true' if done else 'false'}\n")
              output.write(f"instrument={instrument}\n")
          if done:
              print("Round 4 verdict is already committed; scheduled run is a no-op.")
          PY

      - name: Set up pinned Python
        if: steps.state.outputs.done != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned requirements
        if: steps.state.outputs.done != 'true'
        run: python -m pip install --requirement requirements.txt

      - name: Assert seals and run checkpoint-driven compute windows
        if: steps.state.outputs.done != 'true'
        run: |
          python src/audit/verify_trials.py
          python src/audit/audit_holdout_seal.py
          # Spend at most 290 minutes in the runner. Each invocation is capped at
          # 40 minutes so checkpoint publication is frequent and cancellation
          # loses no more than one atomic configuration group.
          deadline=$((SECONDS + 17400))
          instrument="${{ steps.state.outputs.instrument }}"
          while (( SECONDS < deadline )); do
            remaining=$((deadline - SECONDS))
            slice=$((remaining < 2400 ? remaining : 2400))
            python -m src.validation.round4_gauntlet \
              --instrument "$instrument" \
              --controls top-quartile --max-runtime-seconds "$slice"

            read -r status instrument verdict_written < <(python - <<'PY'
          import json
          from pathlib import Path

          checkpoint = json.loads(Path("reports/phase3_round4_checkpoint.json").read_text())
          print(checkpoint.get("status"), checkpoint.get("instrument"), checkpoint.get("verdict_written"))
          PY
            )
            if [[ "$status" == complete && "$verdict_written" == True ]]; then
              break
            fi
          done
          python src/audit/verify_trials.py
          python src/audit/audit_holdout_seal.py

      - name: Publish end-of-run summary
        if: always() && steps.state.outputs.done != 'true'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          checkpoint = json.loads(Path("reports/phase3_round4_checkpoint.json").read_text())
          print("## Round 4 gauntlet")
          print()
          print(f"- Status: `{checkpoint.get('status')}`")
          print(f"- Next instrument: `{checkpoint.get('instrument')}`")
          print(f"- Stage: `{checkpoint.get('stage')}`")
          print(f"- Completed configs: `{checkpoint.get('completed_configs')}/{checkpoint.get('total_configs')}`")
          print(f"- Verdict written: `{checkpoint.get('verdict_written')}`")
          PY

      - name: Regenerate manifest and audit source checkout
        if: steps.state.outputs.done != 'true'
        run: |
          python src/audit/build_manifest.py
          python src/audit/audit_ci.py
          python src/audit/audit_phase0_data.py --source-checkout

      - name: Commit, rebase, re-audit, and push to main
        if: steps.state.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/MANIFEST_SHA256.json reports trials/trials.jsonl
          if git diff --cached --quiet; then
            echo "No new Round 4 checkpoint was produced."
            exit 0
          fi
          git commit -m "validation: advance resumable Round 4 gauntlet"
          git pull --rebase origin main
          python src/audit/build_manifest.py
          git add manifests/MANIFEST_SHA256.json
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          python src/audit/audit_ci.py
          python src/audit/audit_phase0_data.py --source-checkout
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
